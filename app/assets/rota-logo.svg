<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <!-- Primary Rotational Azure Gradient -->
    <linearGradient id="rota-primary-grad" x1="16" y1="16" x2="104" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="45%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Secondary Depth Ribbon Gradient -->
    <linearGradient id="rota-ribbon-grad" x1="40" y1="28" x2="96" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="55%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>

    <!-- Ambient Shadow for Overlapping Loop -->
    <filter id="rota-shadow" x="-10%" y="-10%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1E3A8A" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="8" y="8" width="104" height="104" rx="28" fill="#F0F6FF" stroke="#DBEAFE" stroke-width="2"/>

  <!-- Geometric Interlocking "R" Vector Mark -->
  <g filter="url(#rota-shadow)">
    <!-- Main Left Stem & Upper Arc (Continuous Shift Loop) -->
    <path
      d="M 36 34
         C 36 30.686 38.686 28 42 28
         H 64
         C 78.359 28 88 37.641 88 51
         C 88 62.43 80.6 71.5 70 73.5
         L 85 91
         C 86.8 93.1 85.3 96 82.5 96
         H 73
         C 71.2 96 69.5 95 68.5 93.5
         L 55 74
         H 48
         V 92
         C 48 94.209 46.209 96 44 96
         H 40
         C 37.791 96 36 94.209 36 92
         V 34 Z"
      fill="url(#rota-primary-grad)"
    />

    <!-- Interwoven Orbital Shift Swirl (Negative Core Cutout + Counter Loop) -->
    <path
      d="M 48 40
         H 63
         C 71.837 40 77 44.5 77 51.5
         C 77 58.5 71.837 63 63 63
         H 48
         V 40 Z"
      fill="#F0F6FF"
    />

    <!-- Inner Dynamic Counter-Curve Ribbon (Evoking Clock Rotation & Coordination) -->
    <path
      d="M 52 44
         H 62
         C 67.5 44 71 47 71 51.5
         C 71 56 67.5 59 62 59
         H 52
         V 44 Z"
      fill="url(#rota-ribbon-grad)"
      opacity="0.2"
    />

    <!-- Dynamic Flow Baton / Shift Handoff Accent -->
    <path
      d="M 58 64
         L 76 87
         C 77.2 88.5 79.5 88.5 80.8 87
         C 81.8 85.8 81.6 84 80.4 82.6
         L 64.5 62
         C 62.8 61 60 62 58 64 Z"
      fill="url(#rota-ribbon-grad)"
    />
  </g>
</svg>
